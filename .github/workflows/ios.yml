name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Mish.xcodeproj
        run: xcodegen generate

      - name: Build Mish.app (Unsigned)
        run: |
          xcodebuild \
            -project Mish.xcodeproj \
            -scheme Mish \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Unsigned .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Mish.app Payload/
          zip -r Mish.ipa Payload

      - name: Upload Mish.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mish-iOS-Unsigned
          path: Mish.ipa
